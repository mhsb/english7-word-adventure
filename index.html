<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f9e7a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>ماجرای کلمه‌ها — انگلیسی هفتم</title>
<style>
:root{--bg:#fff8e7;--card:#ffffff;--pri:#2f9e7a;--pri-d:#237a5d;--acc:#f5a623;--bad:#e4572e;--ink:#2b2d42;--soft:#8d99ae;--ok:#d8f3e8;--no:#fde2dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:18px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:12px 14px 40px}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;border-radius:16px;min-height:52px;padding:10px 18px;background:var(--pri);color:#fff;font-weight:700;box-shadow:0 4px 0 var(--pri-d);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 #e3dcc8;border:2px solid #efe6cc}
button.acc{background:var(--acc);box-shadow:0 4px 0 #c4811a}
button:disabled{opacity:.45}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .bar{flex:1;height:14px;background:#eadfbd;border-radius:9px;overflow:hidden}
.top .bar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .4s}
.icon{min-height:46px;min-width:46px;padding:6px 10px;font-size:1.2rem}
.hero{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.chick{font-size:3rem;line-height:1}
.bubble{background:#fff;border:2px solid #efe6cc;border-radius:18px;padding:10px 14px;flex:1;font-weight:600;line-height:1.7}
h1{font-size:1.5rem;margin:6px 0}
h2{font-size:1.1rem;margin:16px 0 8px}
.garden{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#e9f7ee;border-radius:18px;padding:10px;text-align:center;font-size:1.4rem}
.garden span{display:block}
.missions{display:grid;gap:10px}
.m{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid #efe6cc;border-radius:18px;padding:12px;text-align:right;width:100%;color:var(--ink);box-shadow:0 3px 0 #e3dcc8;min-height:70px}
.m .e{font-size:2rem}
.m .t{flex:1;font-weight:700}
.m small{display:block;color:var(--soft);font-weight:400}
.m.locked{opacity:.5}
.stars{letter-spacing:2px}
.card{background:var(--card);border:2px solid #efe6cc;border-radius:22px;padding:18px;text-align:center;margin:10px 0}
.pic{font-size:5.5rem;line-height:1.1}
.pic.num{font-size:4rem;font-weight:800;color:var(--pri)}
.word{font-size:2.6rem;font-weight:800;direction:ltr;unicode-bidi:isolate;margin:8px 0;letter-spacing:1px}
.word i{color:var(--soft);font-style:normal;margin:0 2px}
.fa{font-size:1.5rem;font-weight:700;color:var(--ink)}
.fa.big{font-size:2.1rem;color:var(--pri-d);margin:12px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.opt{background:#fff;color:var(--ink);border:3px solid #efe6cc;box-shadow:0 4px 0 #e3dcc8;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;border-radius:20px}
.opt .pic{font-size:3rem}
.opt .pic.num{font-size:2.2rem}
.opt span{font-size:.9rem;font-weight:700}
.opt.txt{min-height:92px}
.opt.txt span{font-size:1.2rem}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt.good{background:var(--ok);border-color:var(--pri)}
.opt.bad{background:var(--no);border-color:var(--bad)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.slots{display:flex;gap:6px;justify-content:center;direction:ltr;flex-wrap:wrap;margin:10px 0}
.slot{width:42px;height:54px;border-bottom:4px solid #cbbf96;font-size:2rem;font-weight:800;display:flex;align-items:flex-end;justify-content:center;color:var(--pri)}
.tiles{display:flex;gap:10px;justify-content:center;direction:ltr;flex-wrap:wrap;margin-top:12px}
.tile{min-width:56px;min-height:60px;font-size:1.8rem;background:#fff;color:var(--ink);border:3px solid #efe6cc;box-shadow:0 4px 0 #e3dcc8;border-radius:16px}
.tile.used{visibility:hidden}
.tile.wd{font-size:1.2rem;padding:8px 14px;min-width:60px}
.slot.w{width:auto;min-width:54px;padding:0 10px;font-size:1.5rem}
.slot.k{color:var(--ink)}
.slot.f{color:var(--pri)}
.slot.b.on{border-bottom-color:var(--acc)}
.tile.hint{border-color:var(--acc);animation:pulse .9s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
input.txt{width:100%;font-size:2rem;text-align:center;direction:ltr;padding:12px;border:3px solid #efe6cc;border-radius:16px;font-family:inherit;margin-top:10px}
.blanks{direction:ltr;font-size:1.8rem;letter-spacing:6px;color:var(--soft);font-weight:700;min-height:2.2rem}
.msg{min-height:2rem;font-weight:700;margin-top:8px}
.good-t{color:var(--pri-d)}.bad-t{color:#b8431f}
.result .big{font-size:3rem}
.conf{position:fixed;top:-40px;font-size:1.6rem;animation:fall 3s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:6px;border-bottom:1px solid #eadfbd;text-align:right}
td.l{direction:ltr;text-align:left;font-weight:700}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2d42;color:#fff;padding:10px 16px;border-radius:14px;display:none;z-index:9;max-width:90%;text-align:center}
label.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eadfbd}
label.sw input{width:26px;height:26px}
@media (max-width:380px){.word{font-size:2.1rem}.opt .pic{font-size:2.4rem}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="lessons.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const C=['#e4572e','#2f9e7a','#3a6ea5','#9d4edd'];

/* داده‌ی درس‌ها در lessons.js */
let LESSON=null,WORDS=[],BY={},MISSIONS=[];
function setLesson(id){LESSON=LESSONS.find(l=>l.id===id);WORDS=LESSON.words;BY=Object.fromEntries(WORDS.map(x=>[x.w,x]));MISSIONS=LESSON.missions;save.last=id;persist()}

/* ---------- ذخیره ---------- */
const KEY='wordadv_v2';
function loadSave(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.prog)return d}catch(e){}
 return{prog:{},stars:{},settings:{sound:true,syl:true,slow:true},unlockAll:false}}
let save=loadSave();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
const PK=w=>LESSON.id+':'+w;
const SK=id=>LESSON.id+':'+id;
const P=w=>save.prog[PK(w)]||(save.prog[PK(w)]={p:0,seen:0});
const FLOWER=['🌱','🌿','🌷','🌸'];

/* ---------- صدا ---------- */
let actx=null;
function tone(f,d,v,t){if(!save.settings.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 const o=actx.createOscillator(),g=actx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.08;
 o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d)}catch(e){}}
const sOk=()=>{tone(660,.15);setTimeout(()=>tone(880,.25),120)};
const sNo=()=>tone(300,.18,.04,'triangle');
const sWin=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25),i*140));
function say(text){
 if(!('speechSynthesis' in window)){toast('این مرورگر صدای انگلیسی ندارد؛ مرورگر دیگری امتحان کنید.');return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=save.settings.slow?0.6:0.9;
  const v=speechSynthesis.getVoices().find(v=>/^en[-_]US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
  if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const sayW=w=>say((BY[w]&&BY[w].say)||w);
const SW=x=>'sayW('+JSON.stringify(x.w).replace(/"/g,'&quot;')+')';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}

/* ---------- ابزار ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmt(x){if(!save.settings.syl)return esc(x.s.replace(/·/g,''));
 if(x.ph)return x.s.split(' ').map((s,i)=>`<span style="color:${C[i%4]}">${esc(s)}</span>`).join(' ');
 return x.s.split('·').map((s,i)=>`<span style="color:${C[i%4]}">${esc(s)}</span>`).join('<i>·</i>')}
const norm=s=>String(s).toLowerCase().replace(/[’‘']/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function blanks(t,first){return t.split(' ').map(wd=>wd.split('').map((ch,i)=>first&&i===0?ch.toUpperCase():'_').join(' ')).join('   |   ')}
const pic=x=>x.e?`<div class="pic${x.num?' num':''}">${x.e}</div>`:'';
const PRAISE=['آفرین! 🎉','عالی بود!','دیروز نمی‌دانستی، امروز می‌دانی!','چه پیشرفتی!','درست بود! ⭐','تو می‌توانی!'];
const TRY=['نزدیک بود! دوباره امتحان کن 💪','اشکالی ندارد، یک بار دیگر گوش کن 👂','خوب تلاش کردی! دوباره'];
const rnd=a=>a[Math.random()*a.length|0];
let game=null;

/* ---------- صفحه‌ی اصلی ---------- */
function home(){
 game=null;
 const total=WORDS.length,done=WORDS.filter(x=>P(x.w).p>=3).length;
 const unlocked=i=>i===0||save.unlockAll||(save.stars[SK(MISSIONS[i-1].id)]||0)>0;
 const weak=WORDS.filter(x=>P(x.w).seen>0&&P(x.w).p<3);
 const rs=save.resume&&save.resume.l===LESSON.id?save.resume.g:null;
 $('#app').innerHTML=`
 <div class="top"><button class="ghost icon" onclick="lessons()" aria-label="درس‌ها">📚</button><h1 style="flex:1">${LESSON.title}: ${LESSON.sub}</h1>
  <button class="ghost icon" onclick="toggleSound()" aria-label="صدا">${save.settings.sound?'🔊':'🔇'}</button>
  <button class="ghost icon" onclick="parent_()" aria-label="والدین">⚙️</button></div>
 <div class="hero"><div class="chick">🐥</div><div class="bubble">${done?`باغ تو ${done} گل کامل دارد! ادامه بده.`:'سلام! بیا باغ کلمه‌ها را با هم پر از گل کنیم.'}</div></div>
 <div class="garden">${WORDS.map(x=>`<span title="${x.w}">${FLOWER[P(x.w).p]}</span>`).join('')}</div>
 <div style="text-align:center;color:var(--soft);font-size:.9rem;margin-top:4px">${done} از ${total} گل کامل</div>
 ${rs?`<button class="m" style="border-color:var(--pri);margin:12px 0 0" onclick="resume_()"><span class="e">▶️</span><span class="t">ادامه‌ی مأموریت: ${esc(rs.title)}<small>گام ${rs.i+1} از ${rs.steps.length}</small></span></button>`:''}
 <h2>مأموریت‌ها</h2>
 <div class="missions">
 ${MISSIONS.map((m,i)=>{const s=save.stars[SK(m.id)]||0,u=unlocked(i);
  return `<button class="m ${u?'':'locked'}" ${u?`onclick="start('${m.id}')"`:'disabled'}><span class="e">${u?m.e:'🔒'}</span><span class="t">${m.title}<small>${m.words.length} کلمه</small></span><span class="stars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</span></button>`}).join('')}
 <button class="m" style="border-color:var(--acc)" ${weak.length?`onclick="start('review')"`:'disabled'}><span class="e">🔁</span><span class="t">مرور هوشمند<small>${weak.length?'کلمه‌هایی که هنوز گل کامل نشده‌اند':'بعد از اولین مأموریت باز می‌شود'}</small></span></button>
 </div>`;
}
function toggleSound(){save.settings.sound=!save.settings.sound;persist();home()}

/* ---------- شروع مأموریت ---------- */
function start(id){
 let words,title;
 if(id==='review'){
  words=WORDS.filter(x=>P(x.w).seen>0&&P(x.w).p<3).sort((a,b)=>P(a.w).p-P(b.w).p).slice(0,5).map(x=>x.w);title='مرور هوشمند'
 }else{const m=MISSIONS.find(m=>m.id===id);words=m.words.slice();title=m.title}
 const steps=[];
 words.forEach(w=>{steps.push({t:'learn',w});steps.push({t:'quick',w})});
 const seqs=words.map(w=>{const n=units(BY[w]).length,s=slopes(n);
  return [{t:'read',w}].concat(s.f.map(k=>({t:'fill',w,k})),[{t:'fill',w,k:n}],s.t.map(k=>({t:'tfill',w,k})),[{t:'dict',w}])});
 const mx=Math.max(...seqs.map(a=>a.length));
 for(let r=0;r<mx;r++)shuffle(seqs).forEach(a=>{if(a[r])steps.push(a[r])});
 game={id,title,words,steps,i:0,mistakes:0,dictOK:{},failed:{},used:{}};
 step();
}
function topbar(){
 return `<div class="top"><button class="ghost icon" onclick="quit()" aria-label="خروج">✖</button>
 <div class="bar"><i style="width:${Math.round(game.i/game.steps.length*100)}%"></i></div>
 <button class="ghost icon" onclick="toggleSoundIn()">${save.settings.sound?'🔊':'🔇'}</button></div>`}
function toggleSoundIn(){save.settings.sound=!save.settings.sound;persist();step(true)}
function quit(){if(confirm('بیرون برویم؟ می‌توانی بعداً از همین‌جا ادامه بدهی.')){snap();home()}}
function bubble(t,e){return `<div class="hero"><div class="chick">${e||'🐥'}</div><div class="bubble" id="bub">${t}</div></div>`}
function say2(t,cls){const b=$('#msg');if(b){b.className='msg '+(cls||'');b.textContent=t}}
function snap(){if(game&&game.i<game.steps.length){const g=Object.assign({},game);delete g.cur;save.resume={l:LESSON.id,g};persist()}}
function resume_(){game=JSON.parse(JSON.stringify(save.resume.g));step()}
function next(){game.i++;if(game.i>=game.steps.length)finish();else{snap();step()}}

function step(keep){
 const s=game.steps[game.i],x=BY[s.w];
 if(s.t==='learn')return learn(x,keep);
 if(s.t==='listen'||s.t==='read'||s.t==='quick')return mc(s,x,keep);
 if(s.t==='fill')return fillStart(x,s.k,keep);
 if(s.t==='tfill')return tfillStart(x,s.k,keep);
 if(s.t==='dict')return dict(x,keep);
}

/* پله ۱: ببین و بشنو */
function learn(x,keep){
 $('#app').innerHTML=topbar()+bubble('نگاه کن، گوش بده، بعد بلند تکرار کن 🗣️')+`
 <div class="card">${pic(x)}<div class="word" dir="ltr">${fmt(x)}</div><div class="fa${x.e?'':' big'}">${x.fa}</div>${x.note?`<div style="color:var(--soft);font-size:.9rem;margin-top:6px">${x.note}</div>`:''}
 <div class="row"><button class="acc" onclick="${SW(x)}">🔊 بشنو</button></div></div>
 <div class="row"><button onclick="next()" style="width:100%">بلند گفتم، بعدی ←</button></div>`;
 if(!keep)setTimeout(()=>sayW(x.w),350);
}

/* پله ۲ و ۳: تشخیص شنیداری و خواندن */
function mc(s,x,keep){
 const quick=s.t==='quick',listen=s.t==='listen'||quick,textMode=!x.e;
 const n=quick?2:3;
 const ok=w=>textMode?BY[w].fa!==x.fa:!!BY[w].e;
 const same=game.words.filter(w=>w!==x.w);
 const rest=WORDS.map(a=>a.w).filter(w=>w!==x.w&&!same.includes(w));
 const kind=w=>!!BY[w].ph===!!x.ph;
 const pool=shuffle(same.filter(w=>ok(w)&&kind(w))).concat(shuffle(rest.filter(w=>ok(w)&&kind(w))),shuffle(same.filter(w=>ok(w)&&!kind(w))),shuffle(rest.filter(w=>ok(w)&&!kind(w))));
 const opts=shuffle([x.w].concat(pool.slice(0,n-1)));
 game.cur={opts,err:0};
 const q=quick?'همین الان یاد گرفتی! گوش کن، معنی‌اش کدام است؟ 🧠':listen?(textMode?'گوش کن! معنی‌اش کدام است؟ 👂':'گوش کن! کدام تصویر است؟ 👂'):(textMode?'بخوان! معنی‌اش کدام است؟ 👀':'بخوان! کدام تصویر است؟ 👀');
 $('#app').innerHTML=topbar()+bubble(q)+`
 <div class="card">${listen?`<button class="acc" style="font-size:1.6rem;min-height:80px;width:100%" onclick="${SW(x)}">🔊 دوباره بشنو</button>`
  :`<div class="word" dir="ltr">${fmt(x)}</div><button class="ghost" onclick="${SW(x)}">🔊</button>`}</div>
 <div class="opts${opts.length<3?' two':''}">${opts.map((w,i)=>{const o=BY[w];
  return textMode?`<button class="opt txt" id="o${i}" onclick="pick(${i})"><span>${o.fa}</span></button>`
  :`<button class="opt" id="o${i}" onclick="pick(${i})"><div class="pic${o.num?' num':''}">${o.e}</div><span>${o.fa}</span></button>`}).join('')}</div>
 <div class="msg" id="msg"></div>`;
 if(listen&&!keep)setTimeout(()=>sayW(x.w),400);
}
function pick(i){
 const s=game.steps[game.i],c=game.cur;if(c.locked)return;
 const b=$('#o'+i);
 if(c.opts[i]===s.w){c.locked=1;b.classList.add('good');sOk();say2(rnd(PRAISE),'good-t');sayW(s.w);setTimeout(next,1100)}
 else{c.err++;if(s.t!=='quick')game.mistakes++;b.classList.add('bad','shake');b.disabled=true;sNo();say2(rnd(TRY),'bad-t');setTimeout(()=>sayW(s.w),500)}
}

/* پله ۴: جای خالی تدریجی. واحدها = حرف‌ها (کلمه) یا کلمه‌ها (عبارت). از ۱ جای خالی تا کل. */
const LET='abcdefghijklmnopqrstuvwxyz';
const units=x=>x.ph?x.w.split(' '):x.w.toLowerCase().split('');
const lc=s=>/^I'/.test(s)?s:s.toLowerCase();
function slopes(n){
 const x=n>=4?Math.ceil(n*.7):0,y=n>=5?Math.ceil(n*.5):0;
 return{f:[1,1,2].concat(x>2?[x]:[]).filter(k=>k<n),t:[1].concat(y>1?[y]:[]).filter(k=>k<n)};
}
function pickMiss(w,n,k){
 const all=[...Array(n).keys()];
 if(k>=n)return all;
 const used=(game.used[w]=game.used[w]||[]);
 let cand=all;
 if(k===1){const f=all.filter(i=>!used.includes(i));if(f.length)cand=f}
 const m=shuffle(cand).slice(0,k).sort((p,q)=>p-q);
 if(k===1)used.push(m[0]);
 return m;
}
function distract(x,toks,miss,cnt){
 const need=new Set(miss.map(i=>norm(toks[i])));
 let pool;
 if(x.ph){const own=new Set(toks.map(norm));const t=new Set();
  WORDS.filter(a=>a.ph).forEach(a=>a.w.split(' ').forEach(z=>{if(!own.has(norm(z)))t.add(z)}));
  ['the','is','are','my','your','in','you'].forEach(z=>{if(!own.has(z))t.add(z)});pool=[...t]}
 else pool=LET.split('').filter(l=>!need.has(l));
 return shuffle(pool).slice(0,cnt);
}
function fillStart(x,k,keep){
 const toks=units(x),n=toks.length,miss=pickMiss(x.w,n,k);
 const dis=k<n?distract(x,toks,miss,k===1?2:1):[];
 const tiles=shuffle(miss.map(i=>toks[i]).concat(dis)).map(t=>({t:x.ph?lc(t):t,used:false}));
 game.cur={toks,miss,pos:0,err:0,tiles,k,n};
 drawFill(x);
 if(!keep)setTimeout(()=>sayW(x.w),350);
}
function drawFill(x){
 const c=game.cur,toks=c.toks,miss=c.miss,pos=c.pos,n=c.n,k=c.k;
 const target=pos<miss.length?norm(toks[miss[pos]]):null;
 const hint=c.err>=2&&target!==null?c.tiles.findIndex(t=>!t.used&&norm(t.t)===target):-1;
 const slot=(t,i)=>{const mi=miss.indexOf(i);
  const txt=(mi<0||mi<pos)?(x.ph?t:(i===0?t.toUpperCase():t)):'';
  const cls='slot'+(x.ph?' w':'')+(mi<0?' k':mi<pos?' f':(mi===pos?' b on':' b'));
  return `<div class="${cls}">${esc(txt)}</div>`};
 const q=k<n?(x.ph?'کلمه‌ی جاافتاده کدام است؟ ✏️':'حرف جاافتاده کدام است؟ ✏️'):(x.ph?'کلمه‌ها را به ترتیب بزن و عبارت را بساز 🧩':'حرف‌ها را به ترتیب بزن و کلمه را بساز 🧩');
 $('#app').innerHTML=topbar()+bubble(q)+`
 <div class="card">${pic(x)}<div class="fa${x.e?'':' big'}">${x.fa}</div>
 <div class="row"><button class="acc" onclick="${SW(x)}">🔊 بشنو</button></div>
 <div class="slots">${toks.map(slot).join('')}</div></div>
 <div class="tiles">${c.tiles.map((t,i)=>`<button class="tile${x.ph?' wd':''}${t.used?' used':''}${i===hint?' hint':''}" onclick="fillTap(${i})">${esc(t.t)}</button>`).join('')}</div>
 <div class="msg" id="msg"></div>`;
}
function fillTap(i){
 const s=game.steps[game.i],x=BY[s.w],c=game.cur,t=c.tiles[i];
 if(!t||t.used||c.locked)return;
 if(norm(t.t)===norm(c.toks[c.miss[c.pos]])){t.used=true;c.pos++;tone(600+c.pos*40,.12);
  if(c.pos===c.miss.length){c.locked=1;drawFill(x);sOk();say2(rnd(PRAISE),'good-t');sayW(x.w);setTimeout(next,1200)}else drawFill(x)}
 else{c.err++;game.mistakes++;sNo();drawFill(x);say2(c.err>=2?'گزینه‌ی نورانی را بزن 👆':'این نبود، دوباره 💪','bad-t')}
}

/* تایپ تدریجی: فقط حرف‌ها/کلمه‌های جاافتاده را تایپ می‌کند */
function tfillStart(x,k,keep){
 const toks=units(x),n=toks.length,miss=pickMiss(x.w,n,k);
 const exp=x.ph?miss.map(i=>norm(toks[i])).join(' '):miss.map(i=>toks[i]).join('');
 const show=miss.map(i=>toks[i]).join(x.ph?' ':'');
 game.cur={miss,exp,show,att:0,copy:false};
 const slot=(t,i)=>{const m=miss.includes(i);
  return `<div class="slot${x.ph?' w':''}${m?' b':' k'}">${m?'':esc(x.ph?t:(i===0?t.toUpperCase():t))}</div>`};
 $('#app').innerHTML=topbar()+bubble(x.ph?'کلمه‌ی جاافتاده را بنویس ⌨️':'حرف‌های جاافتاده را بنویس ⌨️')+`
 <div class="card">${pic(x)}<div class="fa${x.e?'':' big'}">${x.fa}</div>
 <div class="row"><button class="acc" onclick="${SW(x)}">🔊 بشنو</button></div>
 <div class="slots">${toks.map(slot).join('')}</div>
 <input class="txt" id="inp" type="text" dir="ltr" lang="en" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="جای خالی">
 <div class="msg" id="msg"></div>
 <div class="row"><button onclick="tfillCheck()" style="width:100%">بررسی ✔</button></div></div>`;
 $('#inp').addEventListener('keydown',e=>{if(e.key==='Enter')tfillCheck()});
 if(!keep)setTimeout(()=>{sayW(x.w);try{$('#inp').focus()}catch(e){}},400);
}
function tfillCheck(){
 const s=game.steps[game.i],x=BY[s.w],c=game.cur;if(c.locked)return;
 let v=norm($('#inp').value);if(!x.ph)v=v.replace(/ /g,'');
 if(!v){say2('اول بنویس 🙂');return}
 if(v===c.exp){c.locked=1;sOk();say2(c.copy?'خوب شد!':rnd(PRAISE),'good-t');sayW(x.w);setTimeout(next,1100);return}
 if(c.copy){sNo();say2('دقیقاً همین را بنویس: '+c.show,'bad-t');return}
 c.att++;game.mistakes++;sNo();$('#inp').value='';
 if(c.att===1){say2('نزدیک بود! دوباره گوش کن 👂','bad-t');setTimeout(()=>sayW(x.w),500)}
 else if(c.att===2){say2('حرف اول: '+c.exp[0].toUpperCase()+' 💡','bad-t');setTimeout(()=>sayW(x.w),500)}
 else{c.copy=true;say2('جواب: '+c.show+' — یک‌بار بنویسش ✏️','bad-t')}
 try{$('#inp').focus()}catch(e){}
}

/* پله ۵: املای شنیداری */
function dict(x,keep){
 game.cur={att:0,copy:false};
 $('#app').innerHTML=topbar()+bubble('گوش کن و کلمه را بنویس ✍️')+`
 <div class="card"><button class="acc" style="font-size:1.6rem;min-height:80px;width:100%" onclick="${SW(x)}">🔊 بشنو</button>
 <div class="blanks" id="bl"></div>
 <input class="txt" id="inp" type="text" dir="ltr" lang="en" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="املا">
 <div class="msg" id="msg"></div>
 <div class="row"><button onclick="checkDict()" style="width:100%">بررسی ✔</button></div></div>`;
 $('#inp').addEventListener('keydown',e=>{if(e.key==='Enter')checkDict()});
 if(!keep)setTimeout(()=>{sayW(x.w);try{$('#inp').focus()}catch(e){}},400);
}
function checkDict(){
 const s=game.steps[game.i],x=BY[s.w],c=game.cur;if(c.locked)return;
 const v=norm($('#inp').value),t=norm(x.w);
 if(!v){say2('اول بنویس 🙂');return}
 if(v===t){
  c.locked=1;sOk();
  if(c.att===0&&!c.copy)game.dictOK[x.w]=1;
  say2(c.copy?'خوب شد! دفعه‌ی بعد راحت‌تر می‌شود.':rnd(PRAISE),'good-t');sayW(x.w);setTimeout(next,1200);return}
 if(c.copy){sNo();say2('دقیق مثل بالا بنویس 🙂','bad-t');return}
 c.att++;game.mistakes++;sNo();$('#inp').value='';
 const bl=$('#bl');
 if(c.att===1){bl.textContent=blanks(t);say2('نزدیک بود! '+(x.ph?'این '+t.split(' ').length+' کلمه دارد':t.replace(/ /g,'').length+' حرف دارد')+'. دوباره گوش کن 👂','bad-t');setTimeout(()=>sayW(x.w),500)}
 else if(c.att===2){bl.textContent=blanks(t,true);say2('حرف اول کمکت می‌کند 💡','bad-t');setTimeout(()=>sayW(x.w),500)}
 else{game.failed[x.w]=1;c.copy=true;bl.textContent=x.s.replace(/·/g,'');say2('این هم جواب! یک‌بار از روی آن بنویس تا یاد بگیری ✏️','bad-t')}
 try{$('#inp').focus()}catch(e){}
}

/* ---------- پایان مأموریت ---------- */
function finish(){
 const m=game.mistakes,n=game.words.length;
 const stars=m<=n*2?3:m<=n*5?2:1;
 game.words.forEach(w=>{const p=P(w);p.seen++;if(game.dictOK[w])p.p=Math.min(3,p.p+1)});
 if(game.id!=='review')save.stars[SK(game.id)]=Math.max(save.stars[SK(game.id)]||0,stars);
 save.resume=null;persist();sWin();
 const msg=stars===3?'بی‌نقص! 🏆':stars===2?'خیلی خوب! کم‌کم استاد می‌شوی.':'تمامش کردی و این مهم‌ترین کار است! دفعه‌ی بعد بهتر می‌شود.';
 $('#app').innerHTML=`<div class="result"><div class="card"><div class="big">${'⭐'.repeat(stars)}</div><h1>${msg}</h1>
 <div class="garden" style="grid-template-columns:repeat(${Math.min(n,5)},1fr);margin:10px 0">${game.words.map(w=>`<span>${FLOWER[P(w).p]}<br><small dir="ltr" style="font-size:.7rem">${w}</small></span>`).join('')}</div>
 <p>${game.words.some(w=>game.failed[w])?'بعضی گل‌ها هنوز جوانه‌اند؛ مرور هوشمند به آن‌ها آب می‌دهد 💧':'همه‌ی گل‌ها رشد کردند!'}</p>
 <div class="row"><button onclick="home()">🏠 باغ من</button>${game.id!=='review'?`<button class="acc" onclick="start('${game.id}')">🔁 دوباره</button>`:''}</div></div></div>`;
 for(let i=0;i<22;i++){const s=document.createElement('span');s.className='conf';s.textContent=rnd(['🎉','⭐','🌸','🎈','✨']);s.style.left=Math.random()*95+'vw';s.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}
}

/* ---------- پنل والد / معلم ---------- */
function parent_(){
 $('#app').innerHTML=`<div class="top"><button class="ghost icon" onclick="home()">→</button><h1>پنل والد / معلم</h1></div>
 <div class="card" style="text-align:right">
 <label class="sw">نمایش هجاهای رنگی<input type="checkbox" ${save.settings.syl?'checked':''} onchange="setS('syl',this.checked)"></label>
 <label class="sw">صدای آهسته<input type="checkbox" ${save.settings.slow?'checked':''} onchange="setS('slow',this.checked)"></label>
 <label class="sw">جلوی بازی صدا و جلوه‌های صوتی<input type="checkbox" ${save.settings.sound?'checked':''} onchange="setS('sound',this.checked)"></label>
 <label class="sw">باز بودن همه‌ی مأموریت‌ها<input type="checkbox" ${save.unlockAll?'checked':''} onchange="save.unlockAll=this.checked;persist()"></label>
 </div>
 <h2>وضعیت کلمه‌ها</h2>
 <table><tr><th>کلمه</th><th>معنی</th><th>تمرین</th><th>وضعیت</th></tr>
 ${WORDS.map(x=>`<tr><td class="l">${x.w}</td><td>${x.fa}</td><td>${P(x.w).seen}</td><td>${FLOWER[P(x.w).p]}</td></tr>`).join('')}</table>
 <div class="row" style="margin-top:16px"><button class="ghost" onclick="if(confirm('همه‌ی پیشرفت پاک شود؟')){save=loadSave();save.prog={};save.stars={};persist();home()}">پاک کردن پیشرفت</button></div>
 <p style="color:var(--soft);font-size:.85rem">راهنما: ۳ بار املای درست بدون خطا = گل کامل 🌸. کلمه‌ای که چند بار اشتباه شود جوانه می‌ماند و در «مرور هوشمند» تکرار می‌شود. صدا از موتور گفتار خود دستگاه می‌آید و آفلاین کار می‌کند.</p>`;
}
function setS(k,v){save.settings[k]=v;persist()}

if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
function lessons(){
 game=null;
 $('#app').innerHTML=`<div class="top"><h1 style="flex:1">ماجرای کلمه‌ها · انگلیسی هفتم</h1></div>
 <div class="hero"><div class="chick">🐥</div><div class="bubble">سلام! یک درس را انتخاب کن تا باغ کلمه‌هایش را پر از گل کنیم.</div></div>
 <div class="missions">${LESSONS.map(l=>{setLesson(l.id);const d=l.words.filter(x=>P(x.w).p>=3).length;
  return `<button class="m" onclick="setLesson('${l.id}');home()"><span class="e">${l.e}</span><span class="t">${l.title}<small>${l.sub} · ${d} از ${l.words.length} گل کامل</small></span></button>`}).join('')}</div>
 <p style="color:var(--soft);font-size:.85rem;text-align:center;margin-top:18px">پیشرفت روی همین دستگاه ذخیره می‌شود.</p>`;
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
lessons();
</script>
